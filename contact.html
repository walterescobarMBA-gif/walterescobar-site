<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Contact | Walter Escobar</title>

<style>
:root{
  --bg:#0d1117;
  --panel:#111827;
  --panel2:#0b1220;
  --text:#e6edf3;
  --muted:#9ca3af;
  --soft:#d1d5db;
  --blue:#60a5fa;
  --blue2:#93c5fd;
  --line:#1f2937;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:Arial,sans-serif;
  line-height:1.75;
}

nav{
  background:var(--panel);
  border-bottom:1px solid var(--line);
  position:sticky;
  top:0;
  z-index:999;
}

.nav-wrap{
  max-width:1200px;
  margin:auto;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:14px 20px;
}

.logo{
  color:var(--text);
  text-decoration:none;
  font-weight:bold;
}

.menu{
  display:flex;
  gap:18px;
  align-items:center;
}

.menu a,
.dropbtn{
  color:var(--blue);
  text-decoration:none;
  font-weight:bold;
  background:none;
  border:none;
  font-size:.95rem;
  cursor:pointer;
}

.menu a:hover,
.dropbtn:hover{
  color:var(--blue2);
}

.dropdown{
  position:relative;
}

.dropdown-content{
  display:none;
  position:absolute;
  top:100%;
  left:0;
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:10px;
  min-width:230px;
  padding:10px 0;
  box-shadow:0 15px 30px rgba(0,0,0,.35);
}

.dropdown-content a{
  display:block;
  padding:10px 16px;
  color:var(--soft);
}

.dropdown-content a:hover{
  background:var(--panel2);
  color:var(--blue2);
}

.dropdown:hover .dropdown-content{
  display:block;
}

.menu-toggle{
  display:none;
}

.menu-icon{
  display:none;
  color:var(--blue);
  font-size:1.6rem;
  cursor:pointer;
}

header{
  padding:100px 20px 80px;
  text-align:center;
  background:linear-gradient(to bottom,var(--panel),var(--bg));
}

header h1{
  font-size:clamp(2.7rem,7vw,5rem);
  line-height:1.05;
  margin:0 0 24px;
}

header p{
  max-width:950px;
  margin:auto;
  color:var(--muted);
  font-size:1.18rem;
}

.container{
  max-width:900px;
  margin:auto;
  padding:75px 20px;
}

.card{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:18px;
  padding:36px;
}

.card h2{
  margin-top:0;
  color:var(--blue2);
}

.card p{
  color:var(--soft);
}

.contact-box{
  background:var(--panel2);
  border:1px solid var(--line);
  border-radius:14px;
  padding:24px;
  margin-top:26px;
}

.contact-box h3{
  margin-top:0;
  color:var(--blue);
}

.contact-item{
  margin-bottom:18px;
}

.contact-item strong{
  color:var(--blue2);
}

.statement{
  background:#09101d;
  border:1px solid var(--line);
  border-radius:14px;
  padding:24px;
  margin-top:28px;
}

.highlight{
  color:var(--blue2);
  font-weight:bold;
}

footer{
  text-align:center;
  padding:45px 20px;
  border-top:1px solid var(--line);
  color:#6b7280;
}

@media(max-width:800px){

  .nav-wrap{
    flex-wrap:wrap;
  }

  .menu-icon{
    display:block;
  }

  .menu{
    display:none;
    width:100%;
    flex-direction:column;
    align-items:flex
